# Default pipeline configuration — discovery-prompt variant (P1.1)
# Identical to config/default.yaml except prompt.version = v8_discovery.
# Zero gold parameter names from the evaluation set appear in that prompt.

model:
  name: "qwen2.5:7b-instruct"
  provider: "ollama"
  base_url: "http://localhost:11434"
  api_key: null

generation:
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0
  max_tokens: 4096
  seed: 42
  num_ctx: 8192

pipeline:
  pass1_method: "regex"
  max_retries: 2
  retry_delay_seconds: 1
  output_dir: "results/"

prompt:
  version: "v8_discovery"
  system_role: "system"
  user_role: "user"

logging:
  level: "INFO"
  log_file: "results/pipeline.log"
