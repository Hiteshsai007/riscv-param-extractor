- name: warl_supported_values
  description: WARL CSR fields allow any value to be written while guaranteeing to
    return a legal value whenever read. The range of supported values can be determined
    by attempting to write a desired setting then reading to see if the value was
    retained.
  type: field_behavior
  constraints: Writing any value is valid, but the read-back must return a legal value.
  evidence: Some read/write CSR fields are only defined for a subset of bit encodings,
